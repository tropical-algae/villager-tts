name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Setup | Checkout Main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup | Reset Main to Workflow SHA
        run: git reset --hard ${{ github.sha }}

      - name: Release | Create Semantic Version
        id: release
        uses: python-semantic-release/python-semantic-release@d2d6aaf91cf8079cdec167f8673e6d951aefc195 # v10.7.0
        with:
          config_file: semantic.toml
          github_token: ${{ secrets.GITHUB_TOKEN }}
          git_committer_name: github-actions
          git_committer_email: actions@users.noreply.github.com

      - name: Release | Upload GitHub Assets
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@b5888bd54c2d888889848d5ab5c41510005320c4 # v10.7.0
        with:
          config_file: semantic.toml
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.release.outputs.tag }}

  publish:
    name: Publish ${{ matrix.target }} Image
    if: needs.release.outputs.released == 'true'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: cpu
            variant: cpu
          - target: cuda
            variant: cuda121

    env:
      IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || format('{0}/villager-tts', secrets.DOCKERHUB_USERNAME) }}

    steps:
      - name: Setup | Checkout Released Tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup | Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Setup | Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup | Docker Metadata
        id: docker_meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}-${{ matrix.variant }}
            type=raw,value=latest,enable=${{ matrix.target == 'cpu' }}

      - name: Publish | Build and Push Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          secrets: |
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          provenance: mode=max
          sbom: true
